<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 450" width="100%" height="100%">
  <defs>
    <!-- Grade quadriculada brModelo -->
    <pattern id="brmodeloGridCascade" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#e3ecf5" stroke-width="0.8"/>
    </pattern>
    
    <!-- Sombra padrão sólida do brModelo -->
    <filter id="brShadowCascade" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo da Janela brModelo -->
  <rect x="0" y="0" width="1140" height="450" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Barra de Abas do brModelo -->
  <rect x="0" y="0" width="1140" height="34" rx="8" fill="#eef2f6" />
  <rect x="0" y="26" width="1140" height="8" fill="#eef2f6" />
  <line x1="0" y1="34" x2="1140" y2="34" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Aba Ativa (*Conceitual_1) -->
  <path d="M 12 34 L 12 8 Q 12 4 16 4 L 145 4 Q 149 4 149 8 L 149 34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="13" y1="34" x2="148" y2="34" stroke="#ffffff" stroke-width="1.5"/>
  
  <rect x="22" y="13" width="14" height="12" rx="1.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text x="42" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">*Conceitual_1</text>
  
  <rect x="910" y="8" width="215" height="20" rx="4" fill="#e2e8f0" />
  <text x="1017" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">brModelo 3.2.0 • Notação em Cascata</text>

  <!-- Área de Trabalho com Grade -->
  <rect x="1" y="35" width="1138" height="375" rx="0" fill="#fcfdfe"/>
  <rect x="1" y="35" width="1138" height="375" rx="0" fill="url(#brmodeloGridCascade)"/>

  <!-- ========================================================
       ENTIDADE 1: peca
       ======================================================== -->
  <!-- Retângulo da Entidade -->
  <rect x="40" y="55" width="140" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.8" filter="url(#brShadowCascade)"/>
  <text x="110" y="86" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">peca</text>

  <!-- Conectores em Cascata (peca) -->
  <!-- 1. id_peca (PK) - leftmost, longest drop -->
  <path d="M 55 107 L 55 295 L 70 295" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="75" cy="295" r="5" fill="#000000" stroke="#000000" stroke-width="1.4"/>
  <text x="86" y="299" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">id_peca (PK)</text>

  <!-- 2. id_categoria (FK) -->
  <path d="M 70 107 L 70 265 L 85 265" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="90" cy="265" r="5" fill="#000000" stroke="#000000" stroke-width="1.4"/>
  <text x="101" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">id_categoria (FK)</text>

  <!-- 3. quantidade_estoque -->
  <path d="M 85 107 L 85 235 L 100 235" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="105" cy="235" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="116" y="239" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">quantidade_estoque</text>

  <!-- 4. nome_peca -->
  <path d="M 100 107 L 100 205 L 115 205" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="120" cy="205" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="131" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">nome_peca</text>

  <!-- 5. preco_unitario -->
  <path d="M 115 107 L 115 175 L 130 175" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="135" cy="175" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="146" y="179" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">preco_unitario</text>

  <!-- 6. descricao_tecnica -->
  <path d="M 130 107 L 130 145 L 145 145" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="150" cy="145" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="161" y="149" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">descricao_tecnica</text>


  <!-- ========================================================
       ENTIDADE 2: categoria
       ======================================================== -->
  <!-- Retângulo da Entidade -->
  <rect x="330" y="55" width="135" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.8" filter="url(#brShadowCascade)"/>
  <text x="397" y="86" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">categoria</text>

  <!-- Conectores em Cascata (categoria) -->
  <!-- 1. id_categoria (PK) -->
  <path d="M 350 107 L 350 205 L 365 205" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="370" cy="205" r="5" fill="#000000" stroke="#000000" stroke-width="1.4"/>
  <text x="381" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">id_categoria (PK)</text>

  <!-- 2. nome -->
  <path d="M 368 107 L 368 175 L 383 175" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="388" cy="175" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="399" y="179" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">nome</text>

  <!-- 3. descricao -->
  <path d="M 386 107 L 386 145 L 401 145" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="406" cy="145" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="417" y="149" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">descricao</text>


  <!-- ========================================================
       ENTIDADE 3: cliente
       ======================================================== -->
  <!-- Retângulo da Entidade -->
  <rect x="560" y="55" width="140" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.8" filter="url(#brShadowCascade)"/>
  <text x="630" y="86" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">cliente</text>

  <!-- Conectores em Cascata (cliente) -->
  <!-- 1. id_cliente (PK) -->
  <path d="M 575 107 L 575 295 L 590 295" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="595" cy="295" r="5" fill="#000000" stroke="#000000" stroke-width="1.4"/>
  <text x="606" y="299" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">id_cliente (PK)</text>

  <!-- 2. nome_completo -->
  <path d="M 590 107 L 590 265 L 605 265" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="610" cy="265" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="621" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">nome_completo</text>

  <!-- 3. cpf_cnpj -->
  <path d="M 605 107 L 605 235 L 620 235" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="625" cy="235" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="636" y="239" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">cpf_cnpj</text>

  <!-- 4. telefone -->
  <path d="M 620 107 L 620 205 L 635 205" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="640" cy="205" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="651" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">telefone</text>

  <!-- 5. email -->
  <path d="M 635 107 L 635 175 L 650 175" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="655" cy="175" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="666" y="179" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">email</text>

  <!-- 6. endereco -->
  <path d="M 650 107 L 650 145 L 665 145" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="670" cy="145" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="681" y="149" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">endereco</text>


  <!-- ========================================================
       ENTIDADE 4: pedido
       ======================================================== -->
  <!-- Retângulo da Entidade -->
  <rect x="855" y="55" width="140" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.8" filter="url(#brShadowCascade)"/>
  <text x="925" y="86" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">pedido</text>

  <!-- Conectores em Cascata (pedido) -->
  <!-- 1. id_pedido (PK) -->
  <path d="M 870 107 L 870 265 L 885 265" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="890" cy="265" r="5" fill="#000000" stroke="#000000" stroke-width="1.4"/>
  <text x="901" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">id_pedido (PK)</text>

  <!-- 2. id_cliente (FK) -->
  <path d="M 886 107 L 886 235 L 901 235" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="906" cy="235" r="5" fill="#000000" stroke="#000000" stroke-width="1.4"/>
  <text x="917" y="239" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">id_cliente (FK)</text>

  <!-- 3. data_emissao -->
  <path d="M 902 107 L 902 205 L 917 205" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="922" cy="205" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="933" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">data_emissao</text>

  <!-- 4. status -->
  <path d="M 918 107 L 918 175 L 933 175" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="938" cy="175" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="949" y="179" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">status</text>

  <!-- 5. valor_total -->
  <path d="M 934 107 L 934 145 L 949 145" fill="none" stroke="#000000" stroke-width="1.4"/>
  <circle cx="954" cy="145" r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="965" y="149" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">valor_total</text>


  <!-- ==================== LEGENDA VISUAL ==================== -->
  <rect x="25" y="340" width="1090" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <circle cx="45" cy="364" r="5.5" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <text x="58" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#000000">Círculo Preenchido (⚫):</text>
  <text x="200" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">Chave Primária (PK) e Chave Estrangeira (FK)</text>

  <circle cx="580" cy="364" r="5.5" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="593" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#0284c7">Círculo Vazado (⚪):</text>
  <text x="715" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">Atributos Descritivos Comuns</text>

  <!-- Rodapé informativo -->
  <rect x="1" y="410" width="1138" height="39" rx="0 0 7 7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="434" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">📌 Notação Gráfica em Cascata: Disposição vertical escalonada para máxima legibilidade no brModelo</text>
  <text x="1120" y="434" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">AutoMetal Brasil S.A.</text>
</svg>
