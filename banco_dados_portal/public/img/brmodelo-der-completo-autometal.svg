  <rect x="0" y="26" width="1200" height="8" fill="#eef2f6" />
  <line x1="0" y1="34" x2="1200" y2="34" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Aba Ativa -->
  <path d="M 12 34 L 12 8 Q 12 4 16 4 L 155 4 Q 159 4 159 8 L 159 34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
