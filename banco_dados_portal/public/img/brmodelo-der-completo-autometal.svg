<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="100%" height="100%">
  <defs>
    <!-- Grade quadriculada brModelo -->
    <pattern id="gridDerCompleto" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#e3ecf5" stroke-width="0.8"/>
    </pattern>
    
    <!-- Sombra padrão sólida dos blocos do brModelo -->
    <filter id="shadowDer" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Janela brModelo -->
  <rect x="0" y="0" width="1200" height="670" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

